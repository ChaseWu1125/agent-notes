<!doctype html>
<!--
  新頁面模板（AGENTS.md 第 6 節）
  1. 複製本檔為 pages/<slug>.html
  2. 取代所有 {{…}}，刪除用不到的元件
  3. 到 data/pages.js 登記同一筆 slug / title
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{標題}}｜Agent 學習卡</title>
  <meta name="description" content="{{一句話重點}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="../index.html">Agent <span>學習卡</span></a>
      <nav><a href="../index.html">全部卡片</a></nav>
    </div>
  </header>

  <main class="wrap">
    <article>
      <header class="page-head">
        <div class="crumbs"><a href="../index.html">首頁</a> / {{分類}}</div>
        <div class="meta"><span class="tag" data-cat="{{分類}}">{{分類}}</span><span>第 {{週次}} 週</span></div>
        <h1>{{標題}}</h1>
      </header>

      <p class="tldr">{{一句話重點，40 字以內}}</p>

      <section>
        <h2>是什麼？</h2>
        <p>{{段落}}</p>
      </section>

      <section>
        <h2>為什麼重要？</h2>
        <div class="callout tip"><strong>{{提示標題}}</strong><p>{{提示內容}}</p></div>
      </section>

      <section>
        <h2>怎麼用？</h2>
        <ol class="steps">
          <li><strong>{{步驟}}</strong>{{說明}}</li>
        </ol>
      </section>

      <section class="recap">
        <h2>重點回顧</h2>
        <ul>
          <li>{{重點 1}}</li>
          <li>{{重點 2}}</li>
          <li>{{重點 3}}</li>
        </ul>
      </section>

      <nav class="pager" data-slug="{{slug}}"></nav>
    </article>
  </main>

  <footer class="site-foot">Agent 學習卡 · 用 AGENTS.md 驅動的筆記網站</footer>

  <script src="../data/pages.js"></script>
  <script src="../assets/main.js"></script>
</body>
</html>
